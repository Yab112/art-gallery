<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arthopia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Start the homepage hero download before the JS bundle runs (Vercel image CDN only).
      if (location.pathname === "/" && !/^(localhost|127\.)/.test(location.hostname)) {
        var u = "/_vercel/image?url=%2Fartopia.jpg&w=";
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "image"; l.fetchPriority = "high"; l.imageSizes = "100vw";
        l.imageSrcset = [64,128,256,384,640,828,1080,1600,2048].map(function (w) { return u + w + "&q=75 " + w + "w"; }).join(", ");
        document.head.appendChild(l);
      }
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
